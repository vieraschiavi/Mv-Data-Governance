# Instalador del OWNER: el mismo programa, pero ya desbloqueado y atado a tu
# máquina. Solo para el dueño del producto — no se le entrega a nadie.
#
# ────────────────────────────────────────────────────────────────────────────
# Dos candados, no uno
# ────────────────────────────────────────────────────────────────────────────
# 1. DÓNDE QUEDA. Este .exe se publica como ARTEFACTO de la corrida, nunca
#    como Release. Motivo: los assets de una Release quedan pegados al repo
#    para siempre, así que el día que el repo pase de privado a público —o se
#    comparta con alguien— TODAS las releases históricas quedan expuestas de
#    golpe, incluida esta. Un artefacto vence solo (7 días acá) y no deja
#    rastro permanente. Se baja desde la pestaña Actions, con tu cuenta.
#
# 2. QUE NO SIRVA SI SE FILTRA. El candado de arriba se rompe en cuanto un
#    archivo se reenvía por mail. Por eso la licencia que va adentro está
#    ATADA A TU MÁQUINA (campo "mid", ver mvdg/machine.py): en cualquier otra
#    PC el id no coincide, licensing.verify() la descarta y el programa abre
#    en plan demo. Un .exe filtrado no le sirve a nadie.
#
# ────────────────────────────────────────────────────────────────────────────
# Preparación (una sola vez)
# ────────────────────────────────────────────────────────────────────────────
#   1. En TU PC:   python packaging/licencias.py maquina
#   2. Firmá con TU clave privada, atando el token a ese id:
#        python packaging/licencias.py firmar --plan owner \
#            --email <tu-email> --maquina <id-del-paso-1>
#   3. Guardá el token como secreto MVDG_OWNER_TOKEN en
#      Settings -> Secrets and variables -> Actions.
#
# Después: Actions -> "Instalador Owner" -> Run workflow -> bajás el artefacto.
#
# El PROGRAMA es idéntico al que compra un cliente: mismo mvdg.spec, mismo
# instalador.iss, mismo código. Lo único que cambia es que viaja un archivo
# licencia_owner.txt al lado del .exe. No es un build con menos controles —
# ese token pasa por la MISMA verificación Ed25519 que la licencia de
# cualquier comprador.
name: Instalador Owner

on:
  workflow_dispatch:

permissions:
  contents: read        # NO necesita write: no publica Releases a propósito

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Falla temprano y con un mensaje que dice qué hacer, en vez de
      # construir 200 MB para descubrir al final que no hay licencia.
      - name: Verificar que existe el secreto
        shell: pwsh
        env:
          TOKEN: ${{ secrets.MVDG_OWNER_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            throw "Falta el secreto MVDG_OWNER_TOKEN. Generalo con: " +
                  "python packaging/licencias.py maquina  y despues  " +
                  "python packaging/licencias.py firmar --plan owner " +
                  "--email <tu-email> --maquina <id>"
          }

      - name: Instalar dependencias
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Leer la versión del programa
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import mvdg; print(mvdg.__version__)')" >> "$GITHUB_OUTPUT"

      # Chequeo real de la licencia ANTES de empaquetarla: que sea un token
      # MVDG2 con firma válida, plan "owner" y atado a una máquina. Sin esto,
      # un token mal pegado produciría un instalador que abre en demo y el
      # descubrimiento sería recién al instalarlo.
      - name: Validar la licencia del owner
        shell: bash
        env:
          TOKEN: ${{ secrets.MVDG_OWNER_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          from mvdg import licensing
          token = os.environ["TOKEN"].strip()
          # check_machine=False: el runner NO es tu PC — es justamente el
          # punto. Acá se valida firma, plan y que venga atado.
          p = licensing.verify(token, check_machine=False)
          if p is None:
              sys.exit("El token no verifica: revisá que sea el MVDG2 emitido "
                       "con la privada que corresponde a la publica de "
                       "mvdg/licensing.py")
          if p.get("plan") != licensing.PLAN_OWNER:
              sys.exit(f"El token es plan '{p.get('plan')}', se esperaba 'owner'")
          if not p.get("mid"):
              sys.exit("El token NO esta atado a una maquina (falta 'mid'): "
                       "reemitilo con --maquina, si no un exe filtrado "
                       "funcionaria en cualquier PC")
          print(f"Licencia OK: plan={p['plan']} mid={p['mid']}")
          PY

      - name: Empaquetar con PyInstaller
        run: pyinstaller packaging/mvdg.spec --noconfirm

      # La licencia se suma DESPUÉS de PyInstaller, como un archivo al lado
      # del .exe: así el binario empaquetado es byte por byte el mismo que el
      # del cliente, y lo único distinto del instalador es este .txt.
      - name: Agregar la licencia al bundle
        shell: bash
        env:
          TOKEN: ${{ secrets.MVDG_OWNER_TOKEN }}
        run: printf '%s' "$TOKEN" > dist/MVDataGovernance/licencia_owner.txt

      - name: Asegurar Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Construir el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.ver.outputs.v }} packaging\instalador.iss
          Move-Item "dist\MVDataGovernance_Setup_v${{ steps.ver.outputs.v }}.exe" `
                    "dist\MVDataGovernance_OWNER_Setup_v${{ steps.ver.outputs.v }}.exe"

      - name: Verificar que el instalador es real
        shell: pwsh
        run: |
          $exe = "dist\MVDataGovernance_OWNER_Setup_v${{ steps.ver.outputs.v }}.exe"
          if (-not (Test-Path $exe)) { throw "No se genero $exe" }
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("Instalador owner: {0:N1} MB" -f $mb)
          if ($mb -lt 20) { throw "Pesa $mb MB: sospechoso, no se publica" }

      # 7 días: es tu copia personal, la bajás y la instalás. Cuanto menos
      # tiempo esté disponible, menos superficie.
      - uses: actions/upload-artifact@v4
        with:
          name: MVDataGovernance_OWNER_v${{ steps.ver.outputs.v }}
          path: dist/MVDataGovernance_OWNER_Setup_v${{ steps.ver.outputs.v }}.exe
          retention-days: 7
