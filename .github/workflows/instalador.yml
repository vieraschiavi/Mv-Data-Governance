# Construye el instalador .exe de Windows y lo publica para descargar.
#
# Por qué existe: el .exe pesa cientos de MB y NO puede vivir dentro del repo
# (GitHub rechaza archivos de más de 100 MB y, aunque entrara, quedaría en el
# historial de git para siempre y cada clone lo bajaría). El lugar correcto es
# una Release, que admite hasta 2 GB por archivo y da una URL de descarga
# estable. Este workflow lo construye en un runner Windows real — el mismo
# entorno donde corre el cliente — y lo sube ahí.
#
# Cuándo corre:
#   · Al pushear un tag v* (ej. v1.1.0) -> crea la Release con el .exe adjunto.
#   · Al mergear a main algo que CAMBIA EL PROGRAMA -> reconstruye el .exe y
#     lo deja como artefacto, sin publicar Release. Así siempre hay un
#     instalador fresco para probar sin tener que acordarse de pedirlo.
#     Los `paths` son a propósito: construir 200 MB por un typo en un .md o
#     un cambio de la landing sería quemar minutos de Actions al pedo.
#   · A mano desde Actions ("Run workflow") -> igual que el anterior, para
#     probar un build antes de anunciar una versión.
name: Instalador Windows

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - "mvdg/**"
      - "app/**"
      - "bi_api/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/instalador.yml"
  workflow_dispatch:

# Un merge nuevo a main cancela el build anterior: el .exe que importa es el
# del último código, y son ~10 minutos de runner cada uno.
concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # necesario para crear la Release y adjuntar el .exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Leer la versión del programa
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import mvdg; print(mvdg.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Empaquetar con PyInstaller
        run: pyinstaller packaging/mvdg.spec --noconfirm

      # Inno Setup viene preinstalado en los runners windows-latest; si algún
      # día dejara de estarlo, choco lo repone sin tocar el resto del job.
      - name: Asegurar Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Construir el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.ver.outputs.v }} packaging\instalador.iss

      # Verificación mínima: que el .exe EXISTA y no sea un archivo vacío o de
      # unos pocos KB (un Inno que falla a medias puede dejar un stub). Sin
      # esto, un build roto se publicaría igual y el comprador se lo llevaría.
      - name: Verificar que el instalador es real
        shell: pwsh
        run: |
          $exe = "dist\MVDataGovernance_Setup_v${{ steps.ver.outputs.v }}.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("Instalador: {0:N1} MB" -f $mb)
          if ($mb -lt 20) { throw "El instalador pesa $mb MB: sospechoso, no se publica" }

      - uses: actions/upload-artifact@v4
        with:
          name: MVDataGovernance_Setup_v${{ steps.ver.outputs.v }}
          path: dist/MVDataGovernance_Setup_v${{ steps.ver.outputs.v }}.exe
          retention-days: 90

      # Solo al taggear: publica la Release con el .exe adjunto. Es LA MISMA
      # build que quedó como artefacto arriba — no se recompila, para que lo
      # que se probó sea exactamente lo que se publica.
      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MVDataGovernance_Setup_v${{ steps.ver.outputs.v }}.exe
          body: |
            ## MV Data Governance ${{ steps.ver.outputs.v }} — instalador de Windows

            Descargá `MVDataGovernance_Setup_v${{ steps.ver.outputs.v }}.exe` de acá abajo
            y ejecutalo. No necesita Python ni conexión a internet: trae todo adentro.

            Durante la instalación podés elegir **carpeta y disco** (por ejemplo `D:\`),
            y si querés un acceso directo en el escritorio. El programa se abre en su
            **propia ventana**, no en una pestaña del navegador.

            Esta es **la misma build** que usa el owner: no hay una versión distinta
            para vender y otra para uso interno — las funciones se habilitan por
            licencia, no por binario.
