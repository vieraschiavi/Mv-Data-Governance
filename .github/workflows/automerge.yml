# Merge automático de los PRs de trabajo, cuando los tests pasan.
#
# ────────────────────────────────────────────────────────────────────────────
# Qué hace y qué NO hace
# ────────────────────────────────────────────────────────────────────────────
# Cuando el workflow "tests" termina bien, este busca el PR abierto de esa
# rama y, si cumple TODAS las condiciones de abajo, lo mergea con squash y
# borra la rama. Si no las cumple, no hace nada y lo dice en el log — nunca
# fuerza un merge.
#
# Condiciones (todas, sin excepción):
#   · la rama empieza con "claude/" — las ramas de trabajo de esta sesión;
#     una rama a mano nunca se mergea sola
#   · el PR NO está en borrador (draft = "todavía lo estoy escribiendo")
#   · el PR no tiene la etiqueta "no-automerge" (la salida de emergencia)
#   · el PR es mergeable (sin conflictos)
#   · los tests corrieron SOBRE EL COMMIT ACTUAL del PR y pasaron
#   · ningún otro check está en failure/cancelled/timed_out
#
# ────────────────────────────────────────────────────────────────────────────
# Por qué se verifica el SHA y no alcanza con "tests dio verde"
# ────────────────────────────────────────────────────────────────────────────
# El evento workflow_run trae el resultado de UNA corrida, que puede ser de
# un commit anterior. Sin re-verificar contra el HEAD actual del PR, un push
# nuevo con código roto podría colarse aprovechando el verde del anterior.
#
# Y se exige que los tests EXISTAN para ese commit: si Actions no llegó a
# registrarlos (pasó de verdad en el PR #60, donde solo corrió Vercel),
# "no hay ningún check en rojo" sería cierto y estaríamos mergeando sin que
# nadie haya corrido nada. Ausencia de rojo no es verde.
name: automerge

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write          # mergear y borrar la rama
  pull-requests: write     # comentar/cerrar el PR
  actions: write           # disparar el build del instalador (ver el final)

jobs:
  merge:
    # Si los tests no pasaron no hay nada que evaluar.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const rama = context.payload.workflow_run.head_branch;
            const salir = (m) => { core.info(`No se mergea: ${m}`); };

            if (!rama || !rama.startsWith('claude/')) {
              return salir(`la rama "${rama}" no es una rama de trabajo`);
            }

            const {data: prs} = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${rama}`,
            });
            if (prs.length === 0) return salir(`no hay PR abierto para ${rama}`);
            const pr = prs[0];

            if (pr.draft) return salir(`el PR #${pr.number} esta en borrador`);
            if (pr.labels.some(l => l.name === 'no-automerge')) {
              return salir(`el PR #${pr.number} tiene la etiqueta no-automerge`);
            }

            // Estado fresco: "mergeable" se calcula async y en la respuesta
            // de list() puede venir null.
            let detalle;
            for (let i = 0; i < 5; i++) {
              ({data: detalle} = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number}));
              if (detalle.mergeable !== null) break;
              await new Promise(r => setTimeout(r, 3000));
            }
            if (detalle.mergeable === false) {
              return salir(`el PR #${pr.number} tiene conflictos`);
            }

            // --- los checks, contra el HEAD ACTUAL del PR ---
            const sha = detalle.head.sha;
            const {data: checks} = await github.rest.checks.listForRef({
              owner, repo, ref: sha, per_page: 100,
            });

            // Un mismo check puede aparecer VARIAS veces sobre el mismo
            // commit: un PR dispara push y pull_request, y el concurrency de
            // tests.yml cancela el run duplicado. Esos "cancelled" quedan
            // pegados al commit para siempre. Sin quedarse con el MAS
            // RECIENTE de cada nombre, el automerge nunca mergearia nada —
            // siempre habria un cancelado a mano.
            const ultimo = new Map();
            for (const c of checks.check_runs) {
              const previo = ultimo.get(c.name);
              const masNuevo = !previo ||
                new Date(c.started_at || 0) >= new Date(previo.started_at || 0);
              if (masNuevo) ultimo.set(c.name, c);
            }
            const vigentes = [...ultimo.values()];

            const malos = vigentes.filter(c =>
              ['failure', 'cancelled', 'timed_out', 'action_required']
                .includes(c.conclusion));
            if (malos.length) {
              return salir(`checks en rojo: ${malos.map(c => c.name).join(', ')}`);
            }

            const pendientes = vigentes.filter(c => c.status !== 'completed');
            if (pendientes.length) {
              return salir(`checks sin terminar: ${pendientes.map(c => c.name).join(', ')}`);
            }

            // Ausencia de rojo NO es verde: los tests tienen que haber
            // corrido de verdad sobre ESTE commit.
            const tests = vigentes.filter(c =>
              c.name.startsWith('test') && c.conclusion === 'success');
            if (tests.length === 0) {
              return salir(`no corrieron los tests sobre ${sha.slice(0, 7)} ` +
                           `(checks vistos: ${vigentes.map(c => c.name).join(', ') || 'ninguno'})`);
            }

            core.info(`Mergeando #${pr.number} (${tests.length} jobs de test en verde)`);
            await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number,
              merge_method: 'squash',
              commit_title: `${detalle.title} (#${pr.number})`,
            });

            // Borrar la rama. Que falle esto no invalida el merge, que ya
            // ocurrió: se avisa y se sigue.
            try {
              await github.rest.git.deleteRef({
                owner, repo, ref: `heads/${rama}`});
              core.info(`Rama ${rama} borrada`);
            } catch (e) {
              core.warning(`No se pudo borrar ${rama}: ${e.message}`);
            }

            // ----------------------------------------------------------------
            // Disparar el instalador A MANO, y no con `on: push`
            // ----------------------------------------------------------------
            // GitHub NO crea corridas nuevas para eventos originados con el
            // GITHUB_TOKEN: es su proteccion contra workflows recursivos. O
            // sea que el push que produce ESTE merge no dispara nada.
            //
            // No es teoria: el viejo instalador.yml (PyInstaller) tenia
            // `on: push` a main desde el principio y su ultima corrida fue el
            // 2026-08-11 — 26 merges atras. Estuvo muerto todo ese tiempo sin
            // que nada lo dijera, porque "no corrio" no falla: simplemente no
            // pasa nada. Ese workflow ya no existe (ver abajo).
            //
            // workflow_dispatch es una de las dos excepciones documentadas
            // (junto con repository_dispatch): esos SI crean corrida aunque
            // los pida el GITHUB_TOKEN. Por eso se pide explicitamente.
            //
            // Que falle esto no invalida el merge, que ya ocurrio: se avisa.
            //
            // ----------------------------------------------------------------
            // Un solo instalador, dos versiones
            // ----------------------------------------------------------------
            // instalador_electron.yml construye las DOS ediciones desde el
            // mismo binario: la del CLIENTE (arranca en demo, se desbloquea
            // pegando la licencia que compro) y la del OWNER (licencia
            // adentro, atada a la maquina del dueño). Antes convivia con dos
            // workflows de PyInstaller que hacian lo mismo peor: se
            // eliminaron para no mantener dos superficies donde una queda
            // atras sin que nadie se entere.
            //
            // 'ambas' y no 'owner': el instalador del OWNER necesita el
            // secreto MVDG_OWNER_TOKEN, y si no esta puesto ese build se
            // saltea (a proposito, para no dejar el repo en rojo permanente).
            // Pidiendo solo 'owner', una corrida sin secreto terminaria en
            // VERDE sin haber producido ningun instalador — un verde que no
            // significa nada, que es peor que un rojo.
            //
            // Con 'ambas', el del CLIENTE se construye siempre (no necesita
            // ningun secreto) y el del owner se suma solo cuando el secreto
            // existe. Cuesta un build mas, y a cambio cada merge deja algo
            // descargable de verdad.
            const instaladores = [
              {archivo: 'instalador_electron.yml', inputs: {version: 'ambas'}},
            ];
            for (const {archivo, inputs} of instaladores) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: archivo, ref: 'main', inputs,
                });
                core.info(`Disparado ${archivo}`);
              } catch (e) {
                core.warning(`No se pudo disparar ${archivo}: ${e.message}`);
              }
            }
