# Instalador de escritorio (Electron + NSIS) — versión CLIENTE y versión OWNER.
#
# ────────────────────────────────────────────────────────────────────────────
# Qué entrega
# ────────────────────────────────────────────────────────────────────────────
# Un ZIP con la estructura pedida:
#
#   MVDataGovernance_v<ver>.zip
#   └── INSTALADOR/
#       ├── MVDataGovernance_Setup_<ver>.exe   ← doble clic y listo
#       └── LEEME.txt                          ← qué hace, en ES/EN/PT
#
# El instalador NSIS deja: acceso directo en el ESCRITORIO, entrada en el
# MENÚ INICIO, y DESINSTALADOR en "Agregar o quitar programas" — los tres
# declarados explícitamente en electron/package.json, no heredados de un
# default que puede cambiar entre versiones de electron-builder.
#
# ────────────────────────────────────────────────────────────────────────────
# Cliente vs owner: MISMO programa, distinta licencia
# ────────────────────────────────────────────────────────────────────────────
#   CLIENTE  -> sin licencia adentro. Arranca en plan demo; cuando compra,
#               pega su clave en la pestaña Ayuda y se habilita. NO baja otro
#               programa: es el mismo, desbloqueado.
#   OWNER    -> lleva licencia_owner.txt adentro, ATADA A TU MÁQUINA. Abre
#               desbloqueado sin escribir ninguna clave. Si ese .exe se
#               filtra, en otra PC el id no coincide y abre en plan demo.
#
# Un solo binario es el que se audita, se testea y se firma. Dos builds
# paralelos serían dos superficies donde una queda atrás sin que nadie se
# entere — por eso lo único que cambia entre las dos versiones es un .txt.
#
# Se publica como ARTEFACTO, no como Release: los assets de Release quedan
# pegados al repo para siempre, y el del owner no puede quedar expuesto el
# día que el repo pase a público. El del cliente se sube a la Release a mano
# (o se aloja donde apunte MVDG_INSTALLER_URL).
name: Instalador Escritorio (Electron)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "cliente = sin licencia · owner = desbloqueado para tu PC"
        required: true
        default: cliente
        type: choice
        options: [cliente, owner, ambas]
  # Y al pushear a main algo que cambia el PROGRAMA. Los paths son a
  # proposito: rearmar 400 MB por un typo en un .md seria quemar minutos de
  # Actions al pedo.
  #
  # OJO: este trigger NO alcanza para el caso normal. Los merges los hace
  # automerge.yml con el GITHUB_TOKEN, y GitHub no crea corridas para eventos
  # originados con ese token (proteccion contra recursion). Por eso automerge
  # ademas PIDE este workflow explicitamente por workflow_dispatch, que es una
  # excepcion documentada. Este `push` cubre el otro caso: alguien empujando a
  # main a mano.
  push:
    branches: ["main"]
    paths:
      - "mvdg/**"
      - "app/**"
      - "bi_api/**"
      - "electron/**"
      - "requirements.txt"
      - ".github/workflows/instalador_electron.yml"

permissions:
  contents: write          # publicar la Release del owner

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Que se construye en esta corrida. A mano, lo que se haya elegido; al
      # mergear a main, solo el del owner — que es el que tiene que estar
      # siempre listo. El del cliente se arma a pedido cuando se publica.
      - name: Decidir que versiones construir
        id: modo
        shell: bash
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v="owner"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Construyendo: $v"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Antes de gastar 5 minutos bajando Python y compilando: verificar la
      # configuracion. Las dos cosas que rompieron este instalador (el layout
      # del ._pth y el oneClick que anula la pantalla de carpeta) son
      # configuracion, y fallan aca en segundos en vez de a mitad del build
      # — o peor, en la PC del cliente.
      - name: Verificar la configuracion del instalador
        run: node electron/lib/instalador.test.js

      # Python EMBEBIBLE, no un venv. Un venv guarda en pyvenv.cfg la ruta
      # del Python base de la maquina donde se creo: copiado a la PC de un
      # cliente que no tiene Python, no arranca. La distribucion embeddable
      # de python.org es relocalizable por diseno — es la unica forma de que
      # el .exe ande en una PC recien formateada, que es todo el punto de
      # entregar un instalador.
      - name: Preparar el Python embebido que viaja adentro
        shell: pwsh
        run: |
          $ver = "3.12.7"
          $dest = "pyembed"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = "$env:RUNNER_TEMP\pyembed.zip"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          # El embeddable trae ._pth que DESACTIVA site-packages: sin
          # habilitarlo, pip instala pero los import fallan. Es el fallo
          # clasico de este empaquetado y no da ningun error claro.
          $pth = Get-ChildItem "$dest\python*._pth" | Select-Object -First 1
          (Get-Content $pth) -replace '^#\s*import site', 'import site' |
            Set-Content $pth
          Add-Content $pth "Lib\site-packages"

          # Y la carpeta de ARRIBA, que es donde vive el motor. Esto no es
          # decoracion: con un ._pth presente Python arranca AISLADO, y en
          # modo aislado sys.path es exactamente lo que dice este archivo —
          # no se agrega el directorio actual ni se respeta PYTHONPATH.
          # Sin esta linea, "python -m bi_api.main" no encuentra ni bi_api ni
          # mvdg por mas que el cwd sea el correcto, que es justo como los
          # lanza spawnApi().
          #
          # ".." se resuelve contra la carpeta del ._pth (NO contra el
          # directorio actual: verificado). Por eso el motor tiene que quedar
          # EXACTAMENTE UN NIVEL arriba del python.exe en los dos lados:
          #
          #   build:      <repo>\pyembed\python.exe        -> ".." = <repo>
          #   instalado:  resources\server\python\python.exe -> ".." = resources\server
          #
          # Antes esto se armaba en "build\pyembed", que son DOS niveles: ahi
          # ".." daba <repo>\build, que no tiene el motor. El build fallo 7
          # veces seguidas con "ModuleNotFoundError: No module named 'mvdg'"
          # y no habia instalador de Electron. Si se cambia $dest, tiene que
          # seguir siendo una carpeta al lado del motor.
          Add-Content $pth ".."

          Invoke-WebRequest -UseBasicParsing -Uri "https://bootstrap.pypa.io/get-pip.py" `
            -OutFile "$env:RUNNER_TEMP\get-pip.py"
          & "$dest\python.exe" "$env:RUNNER_TEMP\get-pip.py" --no-cache-dir
          & "$dest\python.exe" -m pip install --no-cache-dir -r requirements.txt

          # Verificacion REAL: que ese Python pueda importar lo que el
          # programa necesita. Si esto falla, el instalador saldria roto y
          # el cliente lo descubriria al abrirlo.
          # Se corre desde OTRA carpeta a proposito. Si se verificara parado
          # en la raiz del repo, un sys.path mal armado podria quedar tapado
          # por el directorio actual y el instalador saldria roto igual — el
          # cliente no tiene el repo, tiene la carpeta de instalacion.
          # Se importa bi_api.main ademas de mvdg porque es lo que arranca de
          # verdad (spawnApi hace "python -m bi_api.main").
          $py = (Resolve-Path "$dest\python.exe").Path
          Push-Location $env:RUNNER_TEMP
          & $py -c "import fastapi, uvicorn, pandas, mvdg, bi_api.main; print('embebido OK', mvdg.__version__)"
          $codigo = $LASTEXITCODE
          Pop-Location
          if ($codigo -ne 0) { throw "El Python embebido no puede importar el motor" }

      # npm ci ANTES de construir la interfaz: build-ui usa esbuild, que sale
      # de node_modules. Estaba al reves y fallaba con "Cannot find package
      # 'esbuild'". El bug estuvo siempre; no se veia porque el build moria
      # antes, en el Python embebido — cada falla tapaba a la siguiente.
      - name: Instalar dependencias de Electron
        working-directory: electron
        run: npm ci

      - name: Construir la interfaz React
        working-directory: electron
        run: npm run build-ui

      - name: Leer la versión del programa
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import mvdg; print(mvdg.__version__)')" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------------- CLIENTE
      - name: Construir instalador CLIENTE
        if: steps.modo.outputs.v == 'cliente' || steps.modo.outputs.v == 'ambas'
        working-directory: electron
        run: npm run dist-win

      - name: Empaquetar INSTALADOR/ (cliente)
        if: steps.modo.outputs.v == 'cliente' || steps.modo.outputs.v == 'ambas'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          New-Item -ItemType Directory -Force -Path "salida\INSTALADOR" | Out-Null
          $exe = Get-ChildItem "electron\dist_electron\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "electron-builder no genero ningun .exe" }
          if ($exe.Length / 1MB -lt 40) {
            throw ("El instalador pesa {0:N1} MB: sospechoso, no se publica" -f ($exe.Length/1MB))
          }
          Copy-Item $exe.FullName "salida\INSTALADOR\MVDataGovernance_Setup_$v.exe"
          # Array de lineas y no un here-string de PowerShell: el `"@` que lo
          # cierra tiene que ir pegado al margen izquierdo, y eso rompe la
          # indentacion del bloque `run: |` de YAML.
          $leeme = @(
            "MV Data Governance $v - Instalador de Windows",
            "",
            "ES: Doble clic en MVDataGovernance_Setup_$v.exe. Elegis carpeta y disco.",
            "    Deja acceso directo en el escritorio y en el menu Inicio, y se",
            "    desinstala desde 'Agregar o quitar programas'.",
            "    Arranca en plan demo. Cuando compres, pega tu clave en la pestana",
            "    Ayuda: es el MISMO programa, no hay una segunda descarga.",
            "",
            "EN: Double-click MVDataGovernance_Setup_$v.exe. Pick folder and drive.",
            "    Adds desktop and Start Menu shortcuts, uninstalls from 'Apps'.",
            "    Starts in demo. After buying, paste your key in the Help tab: it is",
            "    the SAME program, there is no second download.",
            "",
            "PT: Duplo clique em MVDataGovernance_Setup_$v.exe. Escolha pasta e disco.",
            "    Cria atalhos na area de trabalho e no menu Iniciar; desinstala em",
            "    'Aplicativos'. Inicia no plano demo. Apos comprar, cole sua chave na",
            "    aba Ajuda: e o MESMO programa, sem segundo download."
          )
          $leeme | Out-File -FilePath "salida\INSTALADOR\LEEME.txt" -Encoding ascii
          Compress-Archive -Path "salida\INSTALADOR" -DestinationPath "MVDataGovernance_v$v.zip" -Force

      - uses: actions/upload-artifact@v4
        if: steps.modo.outputs.v == 'cliente' || steps.modo.outputs.v == 'ambas'
        with:
          name: MVDataGovernance_CLIENTE_v${{ steps.ver.outputs.v }}
          path: MVDataGovernance_v${{ steps.ver.outputs.v }}.zip
          retention-days: 90

      # ------------------------------------------------------------------ OWNER
      # La licencia se agrega DESPUÉS del build del cliente y se reconstruye:
      # así el programa es idéntico y lo único distinto es el .txt.
      - name: Validar la licencia del owner
        id: owner
        if: steps.modo.outputs.v == 'owner' || steps.modo.outputs.v == 'ambas'
        shell: bash
        env:
          TOKEN: ${{ secrets.MVDG_OWNER_TOKEN }}
        run: |
          # Sin el secreto no hay instalador de owner posible.
          #
          # Cuando cortar y cuando saltear se decide por lo que se PIDIO, no
          # por el evento: el automerge dispara con workflow_dispatch igual
          # que una persona, asi que mirar github.event_name no distingue
          # nada. Se vio en la corrida #9 — el automerge pidio 'owner', falto
          # el secreto, y el build quedo en rojo aunque nadie hubiera apretado
          # nada.
          #
          #   version=owner  -> alguien quiere SOLO el del owner: si falta el
          #                     secreto no hay nada que entregar, corta.
          #   version=ambas  -> el del cliente ya se construyo; el del owner
          #                     se suma si se puede. Se avisa y se sigue.
          if [ -z "$TOKEN" ]; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sin MVDG_OWNER_TOKEN::No se construye el instalador del owner. Generalo y pegalo en Settings > Secrets."
            if [ "${{ steps.modo.outputs.v }}" = "owner" ]; then
              echo "Se pidio SOLO la version owner y falta el secreto: no hay nada que entregar."
              exit 1
            fi
            echo "Se sigue: el instalador del cliente ya se construyo."
            exit 0
          fi
          echo "hay=true" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os, sys
          from mvdg import licensing
          p = licensing.verify(os.environ["TOKEN"].strip(), check_machine=False)
          if p is None:
              sys.exit("El token no verifica contra la publica de mvdg/licensing.py")
          if p.get("plan") != licensing.PLAN_OWNER:
              sys.exit(f"El token es plan '{p.get('plan')}', se esperaba 'owner'")
          # Atar el token a una maquina (campo "mid") exige calcularlo EN esa
          # maquina: sale del hostname y la MAC. Un token emitido fuera de la
          # PC del owner no puede llevarlo. Se acepta, porque un owner sin
          # instalador no le sirve a nadie, pero se avisa fuerte: sin "mid",
          # ese .exe filtrado abre desbloqueado en cualquier PC.
          if p.get("mid"):
              print(f"Licencia OK: plan={p['plan']} atada a la maquina {p['mid']}")
          else:
              print(f"Licencia OK: plan={p['plan']} SIN atar a ninguna maquina")
              print("::warning title=Instalador owner sin atar::Este .exe abre "
                    "desbloqueado en CUALQUIER PC. No lo compartas. Para atarlo, "
                    "corre 'python packaging/licencias.py maquina' en tu equipo y "
                    "reemiti el token con --maquina <id>.")
          PY

      - name: Construir instalador OWNER
        if: steps.owner.outputs.hay == 'true'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.MVDG_OWNER_TOKEN }}
        run: |
          # el token viaja junto al motor, donde licensing._licencia_empaquetada lo busca
          $env:TOKEN | Out-File -FilePath "mvdg\licencia_owner.txt" -Encoding ascii -NoNewline
          cd electron
          npm run dist-win

      - name: Empaquetar INSTALADOR/ (owner)
        if: steps.owner.outputs.hay == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          New-Item -ItemType Directory -Force -Path "salida_owner\INSTALADOR" | Out-Null
          $exe = Get-ChildItem "electron\dist_electron\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "electron-builder no genero ningun .exe" }
          Copy-Item $exe.FullName "salida_owner\INSTALADOR\MVDataGovernance_OWNER_Setup_$v.exe"
          $leeme = @(
            "MV Data Governance $v - INSTALADOR DEL OWNER - NO DISTRIBUIR",
            "",
            "Este instalador viene ya desbloqueado y la licencia esta ATADA A TU",
            "MAQUINA: en cualquier otra PC abre en plan demo. Aun asi, no lo",
            "compartas - para eso esta la version CLIENTE."
          )
          $leeme | Out-File -FilePath "salida_owner\INSTALADOR\LEEME.txt" -Encoding ascii
          Compress-Archive -Path "salida_owner\INSTALADOR" -DestinationPath "MVDataGovernance_OWNER_v$v.zip" -Force

      - uses: actions/upload-artifact@v4
        if: steps.owner.outputs.hay == 'true'
        with:
          name: MVDataGovernance_OWNER_v${{ steps.ver.outputs.v }}
          path: MVDataGovernance_OWNER_v${{ steps.ver.outputs.v }}.zip
          retention-days: 7

      # --------------------------------------------------- Release del owner
      #
      # Pedido explicito: que SIEMPRE haya un instalador owner en GitHub para
      # probar el programa completo, con un link fijo que no caduque. Los
      # artefactos de Actions vencen y hay que entrar a la corrida a buscarlos;
      # una Release tiene URL estable.
      #
      # AVISO, dicho una sola vez y sin vueltas: este repositorio es PUBLICO.
      # Cualquiera puede bajar este .exe, y como el token NO esta atado a una
      # maquina, abre el programa completo en cualquier PC. Es una decision
      # tomada a conciencia, no un descuido.
      #
      # Para cerrarlo el dia que se quiera, sin tocar este workflow:
      #   1. En tu PC:  python packaging/licencias.py maquina    -> da tu id
      #   2. Reemitis el token con --maquina <id>
      #   3. Lo pegas en Settings > Secrets > MVDG_OWNER_TOKEN
      # A partir de ahi, ese mismo .exe abre en plan demo en cualquier otra PC.
      # El paso de validacion de arriba ya distingue los dos casos y avisa.
      #
      # La etiqueta es fija (owner-latest) y se reemplaza en cada corrida: asi
      # el link es siempre el mismo y no se acumulan releases viejas.
      - name: Publicar la Release del owner
        if: steps.owner.outputs.hay == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.v }}"
          exe="salida_owner/INSTALADOR/MVDataGovernance_OWNER_Setup_$v.exe"
          [ -f "$exe" ] || { echo "No se genero $exe"; exit 1; }

          notas="$RUNNER_TEMP/notas.md"
          {
            echo "Instalador de escritorio (Electron + React) de MV Data"
            echo "Governance $v, version OWNER: abre con TODAS las funciones"
            echo "habilitadas, sin pegar ninguna clave."
            echo
            echo "Se reemplaza automaticamente en cada cambio del programa,"
            echo "asi que este link siempre apunta a la ultima version."
            echo
            echo "Al instalar: elegis carpeta y disco (propone una unidad"
            echo "distinta de C: si tenes una con espacio), deja acceso"
            echo "directo en el escritorio y en el menu Inicio, y se"
            echo "desinstala desde Agregar o quitar programas."
          } > "$notas"

          # --clobber reemplaza el asset si ya existia con ese nombre.
          if gh release view owner-latest >/dev/null 2>&1; then
            gh release edit owner-latest --title "MV Data Governance $v · OWNER" \
              --notes-file "$notas"
            gh release upload owner-latest "$exe" --clobber
          else
            gh release create owner-latest "$exe" \
              --title "MV Data Governance $v · OWNER" --notes-file "$notas"
          fi
          echo "Release lista: https://github.com/${{ github.repository }}/releases/tag/owner-latest"
