# MV Data Governance · configuración de herramientas
#
# Solo linter (ruff). NO hay formateador automático: el repo tiene un estilo
# de comentarios y alineación hecho a mano que un formateo masivo destruiría,
# y reformatear todo enterraría el historial de git bajo un diff gigante.

[tool.ruff]
# Coincide con el ancho que ya usa el código escrito a mano.
line-length = 100
target-version = "py310"
extend-exclude = ["electron/node_modules", "build", "dist"]

[tool.ruff.lint]
# E/W (pycodestyle), F (pyflakes), I (orden de imports), B (bugbear),
# UP (modernización), C4 (comprensiones), SIM (simplificaciones).
# Arrancamos con el núcleo real de errores: E4/E7/E9 + F. Las familias de
# estilo puro (I, UP, SIM) quedan fuera a propósito — meterlas hoy son ~1.000
# hallazgos cosméticos que no arreglan ningún bug y ensucian el diff.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# app/app.py inserta la raíz del repo en sys.path ANTES de importar mvdg, para
# poder correr tanto desde el repo como desde el bundle de PyInstaller. Ese
# bootstrap obliga a que los imports vayan después de código: E402 acá es un
# falso positivo estructural, no deuda.
"app/app.py" = ["E402"]
# Los tests importan adentro de cada función a propósito (aislamiento entre
# casos y para poder monkeypatchear módulos antes de importarlos).
"tests/test_core.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q por defecto; `pytest tests/ -v` sigue funcionando igual.
addopts = "-q"
