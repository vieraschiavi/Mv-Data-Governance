#
# Tema oscuro REAL de Streamlit — no existía este archivo, así que el fondo
# oscuro que pinta app/app.py por CSS (.stApp { background: navy }) convivía
# con el tema CLARO por defecto de Streamlit, que sigue coloreando párrafos,
# etiquetas de radio/checkbox/selectbox, expanders, dataframes y alertas con
# su texto casi negro (rgb(49,51,63)) de fábrica. Resultado: texto oscuro
# sobre fondo oscuro en TODA la barra lateral y en cualquier párrafo o
# etiqueta del cuerpo — no un detalle puntual, sino cada pantalla del
# programa (y lo mismo corre `mvdg/server.py` en modo web: es el mismo
# app.py, así que el mismo bug).
#
# Con esto, Streamlit genera sus propios estilos (radios, checkboxes,
# dataframes, alerts, sliders, code blocks) ya coherentes con el fondo
# oscuro, en vez de necesitar un selector CSS por cada widget nativo — que
# es exactamente lo que faltaba: la hoja de estilos de app.py solo cubría
# h1/h2/h3, el valor/etiqueta de las métricas y el fondo de la barra
# lateral, dejando todo lo demás en su color de tema claro por defecto.
[server]
# Streamlit corta las subidas en 200 MB por defecto, y el corte es del
# SERVIDOR: el archivo se sube entero y recién ahí se rechaza, así que el
# usuario espera la subida completa de su Excel para que le digan que no.
# 5 GB es un techo que en la práctica no se toca con un CSV o un Excel; el
# límite real pasa a ser la RAM de la máquina, que es el límite honesto.
#
# Se puede bajar sin tocar código: la variable de entorno
# STREAMLIT_SERVER_MAX_UPLOAD_SIZE (en MB) pisa este valor. Tiene sentido
# bajarlo en modo servidor multiusuario, donde varias subidas grandes a la
# vez sí pueden voltear el proceso.
maxUploadSize = 5000

[theme]
base = "dark"
primaryColor = "#f2b441"
backgroundColor = "#081527"
secondaryBackgroundColor = "#0c2137"
textColor = "#eaf1fb"
